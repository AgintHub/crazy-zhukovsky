dag_type: stub
description: Generated workflow from UI.
name: econometric_macroeconomic_analysis
nodes:
  apply_econometric_models:
    agent: false
    code_node_type: stub
    description: Implement and evaluate econometric models to forecast macroeconomic
      performance
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass ConductTrendAnalysisOutput(BaseModel):\n    \"\"\"Pydantic model for\
      \ conduct_trend_analysis node outputs.\"\"\"\n    trend_directions: List[str]\
      \ = (\n        Field(..., description=\"Textual description of identified trend\
      \ directions (e.g., 'upward', 'downward', 'stable')\")\n    )\n    seasonality_patterns:\
      \ List[str] = (\n        Field(..., description=\"Identified seasonal patterns\
      \ in time series data\")\n    )\n    trend_magnitudes: List[float] = (\n   \
      \     Field(..., description=\"Numerical values representing trend magnitude\
      \ (e.g., regression coefficients)\")\n    )\n    is_significant_trend: List[bool]\
      \ = (\n        Field(..., description=\"Indicator of whether trends are statistically\
      \ significant\")\n    )\n    key_patterns: List[str] = (\n        Field(...,\
      \ description=\"Summary of primary patterns identified in macroeconomic indicators\"\
      )\n    )\n\n\nclass IdentifyKeyMacroeconomicDriversOutput(BaseModel):\n    \"\
      \"\"Pydantic model for identify_key_macroeconomic_drivers node outputs.\"\"\"\
      \n    key_variables: List[str] = (\n        Field(..., description=\"List of\
      \ identified key macroeconomic variables.\")\n    )\n    importance_scores:\
      \ List[float] = (\n        Field(..., description=\"Relative importance score\
      \ for each key variable (higher indicates greater influence).\")\n    )\n  \
      \  relationship_strength: List[float] = (\n        Field(..., description=\"\
      Numeric strength of the relationship between each key variable and the target\
      \ macroeconomic indicator.\")\n    )\n    relationship_direction: List[str]\
      \ = (\n        Field(..., description=\"Direction of the relationship for each\
      \ key variable (e.g., 'positive', 'negative').\")\n    )\n\n\nclass IdentifyPotentialMacroeconomicDriversOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for identify_potential_macroeconomic_drivers node\
      \ outputs.\"\"\"\n    potential_drivers: List[str] = (\n        Field(..., description=\"\
      A list of macroeconomic variable names identified as potential drivers.\")\n\
      \    )\n\n\nclass ApplyEconometricModelsOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for apply_econometric_models node outputs.\"\"\"\n    model_name: str\
      \ = (\n        Field(..., description=\"Name of the econometric model used (e.g.,\
      \ 'Vector Autoregression', 'Unobserved Components Model')\")\n    )\n    forecast_values:\
      \ List[float] = (\n        Field(..., description=\"Numerical forecasts of macroeconomic\
      \ performance metrics\")\n    )\n    significant_drivers: List[str] = (\n  \
      \      Field(..., description=\"List of statistically significant macroeconomic\
      \ drivers included in the model\")\n    )\n    evaluation_metrics: List[float]\
      \ = (\n        Field(..., description=\"Quantitative metrics for model performance\
      \ evaluation (e.g., MAE, RMSE, R-squared)\")\n    )\n    is_model_valid: bool\
      \ = (\n        Field(..., description=\"Indicates whether the model passed diagnostic\
      \ checks (e.g., multicollinearity tests)\")\n    )\n\n\ndef apply_econometric_models(conduct_trend_analysis_input:\
      \ ConductTrendAnalysisOutput, identify_key_macroeconomic_drivers_input: IdentifyKeyMacroeconomicDriversOutput,\
      \ identify_potential_macroeconomic_drivers_input: IdentifyPotentialMacroeconomicDriversOutput,\
      \ **kwargs) -> ApplyEconometricModelsOutput:\n    \"\"\"\n    Constructs and\
      \ validates econometric models using statistically significant\n    macroeconomic\
      \ drivers, trend patterns, and potential drivers to produce\n    macroeconomic\
      \ forecasts.\n\n    Parameters\n    ----------\n    trend_analysis : Dict[str,\
      \ List]\n        Results from conduct_trend_analysis including trend_directions,\n\
      \        seasonality_patterns, and trend_magnitudes\n    key_drivers : Dict[str,\
      \ List]\n        Significant drivers from identify_key_macroeconomic_drivers\
      \ with\n        importance_scores > 0.7\n    potential_drivers : Dict[str, List[str]]\n\
      \        Candidate variables from identify_potential_macroeconomic_drivers\n\
      \n    Returns\n    -------\n    Dict[str, Union[str, List, bool]]\n        Structured\
      \ dictionary containing model specification, forecasts,\n        validation\
      \ metrics, and diagnostic results.\n\n    Raises\n    ------\n    ValueError\n\
      \        If no significant drivers exist after multicollinearity checks\n  \
      \  RuntimeWarning\n        When model convergence issues occur during optimization\n\
      \n    Examples\n    --------\n    >>> model = apply_econometric_models(\n  \
      \  ...     trend_analysis={\n    ...         'trend_directions': ['upward'],\n\
      \    ...         'trend_magnitudes': [0.05]\n    ...     },\n    ...     key_drivers={\n\
      \    ...         'key_variables': ['GDP', 'CPI'],\n    ...         'importance_scores':\
      \ [0.85, 0.72]\n    ...     },\n    ...     potential_drivers={'potential_drivers':\
      \ ['Interest Rate']}\n    >>> )\n    >>> model['model_name'], len(model['forecast_values'])\n\
      \    (\"'Vector Autoregression', 12)\n\n    >>> try:\n    ...     apply_econometric_models({\n\
      \    ...         'trend_directions': ['stable'],\n    ...         'trend_magnitudes':\
      \ [0.0]\n    ...     }, {\n    ...         'key_variables': [],\n    ...   \
      \      'importance_scores': []\n    ...     }, {\n    ...         'potential_drivers':\
      \ ['Unemployment']\n    ...     })\n    >>> except ValueError as e:\n    ...\
      \     str(e)\n    'No valid drivers available after filtering'\n\n    \"\"\"\
      \n    return ApplyEconometricModelsOutput(\n        model_name=\"\",\n     \
      \   forecast_values=[],\n        significant_drivers=[],\n        evaluation_metrics=[],\n\
      \        is_model_valid=False,\n    )"
    name: apply_econometric_models
    nodes_depended_on:
    - conduct_trend_analysis
    - identify_key_macroeconomic_drivers
    - identify_potential_macroeconomic_drivers
    nodes_dependent_on: []
    output_structure:
    - description: Name of the econometric model used (e.g., 'Vector Autoregression',
        'Unobserved Components Model')
      key: model_name
      type: str
    - description: Numerical forecasts of macroeconomic performance metrics
      key: forecast_values
      type: List[float]
    - description: List of statistically significant macroeconomic drivers included
        in the model
      key: significant_drivers
      type: List[str]
    - description: Quantitative metrics for model performance evaluation (e.g., MAE,
        RMSE, R-squared)
      key: evaluation_metrics
      type: List[float]
    - description: Indicates whether the model passed diagnostic checks (e.g., multicollinearity
        tests)
      key: is_model_valid
      type: bool
    prd:
      conceptual_info: Core node for econometric forecasting that synthesizes trend
        patterns, validated drivers, and potential drivers to build and validate predictive
        models. Controls for statistical issues like multicollinearity while generating
        forward-looking economic performance metrics.
      docstring:
        examples:
        - lines:
          - model = apply_econometric_models(
          - '    trend_analysis={'
          - '        ''trend_directions'': [''upward''],'
          - '        ''trend_magnitudes'': [0.05]'
          - '    },'
          - '    key_drivers={'
          - '        ''key_variables'': [''GDP'', ''CPI''],'
          - '        ''importance_scores'': [0.85, 0.72]'
          - '    },'
          - '    potential_drivers={''potential_drivers'': [''Interest Rate'']}'
          - )
          - model['model_name'], len(model['forecast_values'])
          output: ("'Vector Autoregression', 12)
        - lines:
          - 'try:'
          - '    apply_econometric_models({'
          - '        ''trend_directions'': [''stable''],'
          - '        ''trend_magnitudes'': [0.0]'
          - '    }, {'
          - '        ''key_variables'': [],'
          - '        ''importance_scores'': []'
          - '    }, {'
          - '        ''potential_drivers'': [''Unemployment'']'
          - '    })'
          - 'except ValueError as e:'
          - '    str(e)'
          output: '''No valid drivers available after filtering'''
        parameters:
        - description: Results from conduct_trend_analysis including trend_directions,
            seasonality_patterns, and trend_magnitudes
          name: trend_analysis
          type: Dict[str, List]
        - description: Significant drivers from identify_key_macroeconomic_drivers
            with importance_scores > 0.7
          name: key_drivers
          type: Dict[str, List]
        - description: Candidate variables from identify_potential_macroeconomic_drivers
          name: potential_drivers
          type: Dict[str, List[str]]
        raises:
        - description: If no significant drivers exist after multicollinearity checks
          type: ValueError
        - description: When model convergence issues occur during optimization
          type: RuntimeWarning
        returns:
          description: Structured dictionary containing model specification, forecasts,
            validation metrics, and diagnostic results.
          type: Dict[str, Union[str, List, bool]]
        summary: Constructs and validates econometric models using statistically significant
          macroeconomic drivers, trend patterns, and potential drivers to produce
          macroeconomic forecasts.
    prompt: Apply established econometric models (e.g., Vector Autoregression, Unobserved
      Components Model) to forecast macroeconomic performance, incorporating identified
      key drivers and controlling for potential issues (e.g., multicollinearity, omitted
      variable bias)
    shims: []
  collect_economic_data:
    agent: false
    code_node_type: stub
    description: Gather and preprocess macroeconomic data from reliable sources.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass DefineMacroeconomicObjectivesOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for define_macroeconomic_objectives node outputs.\"\"\"\n    objectives:\
      \ List[str] = (\n        Field(..., description=\"List of primary macroeconomic\
      \ objectives (e.g., GDP growth, inflation control, employment level).\")\n \
      \   )\n    metrics: List[str] = (\n        Field(..., description=\"List of\
      \ key performance metrics associated with each objective (e.g., GDP growth rate,\
      \ CPI inflation rate, unemployment rate).\")\n    )\n\n\nclass CollectEconomicDataOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for collect_economic_data node outputs.\"\"\"\n  \
      \  data_source_names: List[str] = (\n        Field(..., description=\"Names\
      \ of data sources used (e.g., 'Bureau of Labor Statistics', 'World Bank').\"\
      )\n    )\n    data_records_count: int = (\n        Field(..., description=\"\
      Total number of data records retrieved across all sources.\")\n    )\n    preprocessing_successful:\
      \ bool = (\n        Field(..., description=\"Indicates whether preprocessing\
      \ (adjustments, normalization) completed without errors.\")\n    )\n    notes:\
      \ str = (\n        Field(..., description=\"Any additional remarks or issues\
      \ encountered during data collection and preprocessing.\")\n    )\n\n\ndef collect_economic_data(define_macroeconomic_objectives_input:\
      \ DefineMacroeconomicObjectivesOutput, **kwargs) -> CollectEconomicDataOutput:\n\
      \    \"\"\"\n    Collects macroeconomic data from specified sources, performs\
      \ normalization,\n    and returns structured output for downstream analysis.\n\
      \n    Parameters\n    ----------\n    objectives : List[str]\n        List of\
      \ macroeconomic objectives (e.g., GDP growth, inflation\n        control) guiding\
      \ data collection priorities.\n    metrics : List[str]\n        Key performance\
      \ metrics (e.g., GDP growth rate, CPI inflation) to\n        extract and normalize.\n\
      \n    Returns\n    -------\n    Dict[str, Union[List[str], int, bool, str]]\n\
      \        Dictionary containing formatted data sources, record counts,\n    \
      \    preprocessing status, and operational notes.\n\n    Raises\n    ------\n\
      \    ConnectionError\n        If unable to access a required data source API\
      \ or database.\n    ValueError\n        If preprocessing steps fail due to incompatible\
      \ data formats or\n        missing required fields.\n\n    Examples\n    --------\n\
      \    >>> collect_economic_data(['GDP growth', 'Inflation control'], ['GDP growth\n\
      \    rate', 'CPI inflation rate'])\n    {'data_source_names': ['Bureau of Labor\
      \ Statistics', 'World Bank'],\n    'data_records_count': 240, 'preprocessing_successful':\
      \ True, 'notes': ''}\n\n    >>> collect_economic_data(['Employment level'],\
      \ ['Unemployment rate'],\n    source_overrides=['Eurostat'])\n    {'data_source_names':\
      \ ['Eurostat'], 'data_records_count': 120,\n    'preprocessing_successful':\
      \ False, 'notes': 'Eurostat data contained\n    inconsistent temporal resolution,\
      \ imputation used'}\n\n    \"\"\"\n    return CollectEconomicDataOutput(\n \
      \       data_source_names=[],\n        data_records_count=0,\n        preprocessing_successful=False,\n\
      \        notes=\"\",\n    )"
    name: collect_economic_data
    nodes_depended_on:
    - define_macroeconomic_objectives
    nodes_dependent_on: []
    output_structure:
    - description: Names of data sources used (e.g., 'Bureau of Labor Statistics',
        'World Bank').
      key: data_source_names
      type: List[str]
    - description: Total number of data records retrieved across all sources.
      key: data_records_count
      type: int
    - description: Indicates whether preprocessing (adjustments, normalization) completed
        without errors.
      key: preprocessing_successful
      type: bool
    - description: Any additional remarks or issues encountered during data collection
        and preprocessing.
      key: notes
      type: str
    prd:
      conceptual_info: This node collects macroeconomic data sources specified by
        user-defined objectives and converts heterogeneous datasets into standardized
        formats. It automates unit conversion, temporal alignment, and data validation
        to prepare inputs for trend analysis and econometric modeling.
      docstring:
        examples:
        - lines:
          - collect_economic_data(['GDP growth', 'Inflation control'], ['GDP growth
            rate', 'CPI inflation rate'])
          output: '{''data_source_names'': [''Bureau of Labor Statistics'', ''World
            Bank''], ''data_records_count'': 240, ''preprocessing_successful'': True,
            ''notes'': ''''}'
        - lines:
          - collect_economic_data(['Employment level'], ['Unemployment rate'], source_overrides=['Eurostat'])
          output: '{''data_source_names'': [''Eurostat''], ''data_records_count'':
            120, ''preprocessing_successful'': False, ''notes'': ''Eurostat data contained
            inconsistent temporal resolution, imputation used''}'
        parameters:
        - description: List of macroeconomic objectives (e.g., GDP growth, inflation
            control) guiding data collection priorities.
          name: objectives
          type: List[str]
        - description: Key performance metrics (e.g., GDP growth rate, CPI inflation)
            to extract and normalize.
          name: metrics
          type: List[str]
        raises:
        - description: If unable to access a required data source API or database.
          type: ConnectionError
        - description: If preprocessing steps fail due to incompatible data formats
            or missing required fields.
          type: ValueError
        returns:
          description: Dictionary containing formatted data sources, record counts,
            preprocessing status, and operational notes.
          type: Dict[str, Union[List[str], int, bool, str]]
        summary: Collects macroeconomic data from specified sources, performs normalization,
          and returns structured output for downstream analysis.
    prompt: Source and extract macroeconomic data from reputable sources (e.g., Bureau
      of Labor Statistics, World Bank), aligning with defined objectives and metrics
      from define_macroeconomic_objectives. Perform normalization, unit consistency
      checks, and missing data imputation.
    shims: []
  conduct_preliminary_data_analysis:
    agent: false
    code_node_type: stub
    description: This node performs an initial exploratory analysis of the macroeconomic
      time‑series data collected in previous steps. It computes simple trend estimates
      (e.g., linear regression slopes or growth rates), flags any statistically significant
      upward or downward movements, and checks for outliers or irregularities that
      may warrant further investigation. The output summarizes the detected trends,
      their quantitative strengths, and whether any anomalies were found.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass DefineMacroeconomicObjectivesOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for define_macroeconomic_objectives node outputs.\"\"\"\n    objectives:\
      \ List[str] = (\n        Field(..., description=\"List of primary macroeconomic\
      \ objectives (e.g., GDP growth, inflation control, employment level).\")\n \
      \   )\n    metrics: List[str] = (\n        Field(..., description=\"List of\
      \ key performance metrics associated with each objective (e.g., GDP growth rate,\
      \ CPI inflation rate, unemployment rate).\")\n    )\n\n\nclass ConductPreliminaryDataAnalysisOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for conduct_preliminary_data_analysis node outputs.\"\
      \"\"\n    identified_trends: List[str] = (\n        Field(..., description=\"\
      List of trend names or descriptors identified in the data\")\n    )\n    trend_strengths:\
      \ List[float] = (\n        Field(..., description=\"Quantitative strength (e.g.,\
      \ slope or growth rate) associated with each identified trend\")\n    )\n  \
      \  anomalies_detected: bool = (\n        Field(..., description=\"Indicates\
      \ whether any anomalies or irregular patterns were detected during preliminary\
      \ analysis\")\n    )\n\n\ndef conduct_preliminary_data_analysis(define_macroeconomic_objectives_input:\
      \ DefineMacroeconomicObjectivesOutput, **kwargs) -> ConductPreliminaryDataAnalysisOutput:\n\
      \    \"\"\"\n    Performs a quick exploratory analysis of macroeconomic data\
      \ to identify\n    trends and detect anomalies.\n\n    Parameters\n    ----------\n\
      \    data : pandas.DataFrame\n        Multivariate time‑series of macroeconomic\
      \ indicators with a\n        DatetimeIndex. Columns correspond to metrics specified\
      \ in the parent\n        node 'define_macroeconomic_objectives'.\n    metrics\
      \ : List[str]\n        List of column names in `data` that represent the macroeconomic\n\
      \        metrics to analyze.\n    window_size : int\n        Size of the rolling\
      \ window (in periods) used to compute local trend\n        slopes. Default is\
      \ 12 (months).\n\n    Returns\n    -------\n    Tuple[List[str], List[float],\
      \ bool]\n        A tuple containing (identified_trends, trend_strengths,\n \
      \       anomalies_detected). The list lengths are equal and correspond to\n\
      \        the same order.\n\n    Raises\n    ------\n    ValueError\n       \
      \ Raised if `data` is empty or missing any of the specified `metrics`.\n   \
      \ TypeError\n        Raised if `data` is not a pandas DataFrame or if `metrics`\
      \ is not a\n        list of strings.\n\n    Examples\n    --------\n    >>>\
      \ import pandas as pd\n    >>> df = pd.DataFrame({\n    ...     'date': pd.date_range('2020-01-01',\
      \ periods=24, freq='M'),\n    ...     'GDP_growth': [2.5, 2.7, 2.6, 2.8, 3.0,\
      \ 3.1, 3.3, 3.4, 3.5, 3.6,\n    3.8, 4.0, 4.1, 4.3, 4.5, 4.6, 4.7, 4.9, 5.0,\
      \ 5.1, 5.3, 5.4, 5.6, 5.8]\n    >>> })\n    >>> df.set_index('date', inplace=True)\n\
      \    >>> trends, strengths, anomalies = conduct_preliminary_data_analysis(df,\n\
      \    ['GDP_growth'])\n    >>> print(trends)\n    >>> print(strengths)\n    >>>\
      \ print(anomalies)\n    ['upward']\n    [0.045]\n    False\n\n    >>> df['inflation']\
      \ = [2.1, 2.3, 2.2, 2.5, 2.7, 2.6, 2.8, 3.0, 3.1, 3.2,\n    3.4, 3.5, 3.6, 3.8,\
      \ 4.0, 4.1, 4.2, 4.3, 4.5, 4.6, 4.8, 5.0, 5.2, 5.4]\n    >>> trends, strengths,\
      \ anomalies = conduct_preliminary_data_analysis(df,\n    ['GDP_growth', 'inflation'],\
      \ window_size=6)\n    >>> print(trends)\n    >>> print(strengths)\n    >>> print(anomalies)\n\
      \    ['upward', 'upward']\n    [0.048, 0.054]\n    True\n\n    \"\"\"\n    return\
      \ ConductPreliminaryDataAnalysisOutput(\n        identified_trends=[],\n   \
      \     trend_strengths=[],\n        anomalies_detected=False,\n    )"
    name: conduct_preliminary_data_analysis
    nodes_depended_on:
    - define_macroeconomic_objectives
    nodes_dependent_on: []
    output_structure:
    - description: List of trend names or descriptors identified in the data
      key: identified_trends
      type: List[str]
    - description: Quantitative strength (e.g., slope or growth rate) associated with
        each identified trend
      key: trend_strengths
      type: List[float]
    - description: Indicates whether any anomalies or irregular patterns were detected
        during preliminary analysis
      key: anomalies_detected
      type: bool
    prd:
      conceptual_info: Conduct_preliminary_data_analysis extracts high‑level trend
        signals and anomaly flags from macroeconomic time‑series to inform subsequent
        model specification and driver selection.
      docstring:
        examples:
        - lines:
          - import pandas as pd
          - df = pd.DataFrame({
          - '    ''date'': pd.date_range(''2020-01-01'', periods=24, freq=''M''),'
          - '    ''GDP_growth'': [2.5, 2.7, 2.6, 2.8, 3.0, 3.1, 3.3, 3.4, 3.5, 3.6,
            3.8, 4.0, 4.1, 4.3, 4.5, 4.6, 4.7, 4.9, 5.0, 5.1, 5.3, 5.4, 5.6, 5.8]'
          - '})'
          - df.set_index('date', inplace=True)
          - trends, strengths, anomalies = conduct_preliminary_data_analysis(df, ['GDP_growth'])
          - print(trends)
          - print(strengths)
          - print(anomalies)
          output: '[''upward'']

            [0.045]

            False'
        - lines:
          - df['inflation'] = [2.1, 2.3, 2.2, 2.5, 2.7, 2.6, 2.8, 3.0, 3.1, 3.2, 3.4,
            3.5, 3.6, 3.8, 4.0, 4.1, 4.2, 4.3, 4.5, 4.6, 4.8, 5.0, 5.2, 5.4]
          - trends, strengths, anomalies = conduct_preliminary_data_analysis(df, ['GDP_growth',
            'inflation'], window_size=6)
          - print(trends)
          - print(strengths)
          - print(anomalies)
          output: '[''upward'', ''upward'']

            [0.048, 0.054]

            True'
        parameters:
        - description: Multivariate time‑series of macroeconomic indicators with a
            DatetimeIndex. Columns correspond to metrics specified in the parent node
            'define_macroeconomic_objectives'.
          name: data
          type: pandas.DataFrame
        - description: List of column names in `data` that represent the macroeconomic
            metrics to analyze.
          name: metrics
          type: List[str]
        - description: Size of the rolling window (in periods) used to compute local
            trend slopes. Default is 12 (months).
          name: window_size
          type: int
        raises:
        - description: Raised if `data` is empty or missing any of the specified `metrics`.
          type: ValueError
        - description: Raised if `data` is not a pandas DataFrame or if `metrics`
            is not a list of strings.
          type: TypeError
        returns:
          description: A tuple containing (identified_trends, trend_strengths, anomalies_detected).
            The list lengths are equal and correspond to the same order.
          type: Tuple[List[str], List[float], bool]
        summary: Performs a quick exploratory analysis of macroeconomic data to identify
          trends and detect anomalies.
    prompt: Conduct a preliminary analysis of the macroeconomic data to identify potential
      trends and patterns.
    shims: []
  conduct_trend_analysis:
    agent: false
    code_node_type: stub
    description: Analyze time series data to identify patterns and trends in macroeconomic
      indicators
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass CollectEconomicDataOutput(BaseModel):\n    \"\"\"Pydantic model for\
      \ collect_economic_data node outputs.\"\"\"\n    data_source_names: List[str]\
      \ = (\n        Field(..., description=\"Names of data sources used (e.g., 'Bureau\
      \ of Labor Statistics', 'World Bank').\")\n    )\n    data_records_count: int\
      \ = (\n        Field(..., description=\"Total number of data records retrieved\
      \ across all sources.\")\n    )\n    preprocessing_successful: bool = (\n  \
      \      Field(..., description=\"Indicates whether preprocessing (adjustments,\
      \ normalization) completed without errors.\")\n    )\n    notes: str = (\n \
      \       Field(..., description=\"Any additional remarks or issues encountered\
      \ during data collection and preprocessing.\")\n    )\n\n\nclass ConductTrendAnalysisOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for conduct_trend_analysis node outputs.\"\"\"\n \
      \   trend_directions: List[str] = (\n        Field(..., description=\"Textual\
      \ description of identified trend directions (e.g., 'upward', 'downward', 'stable')\"\
      )\n    )\n    seasonality_patterns: List[str] = (\n        Field(..., description=\"\
      Identified seasonal patterns in time series data\")\n    )\n    trend_magnitudes:\
      \ List[float] = (\n        Field(..., description=\"Numerical values representing\
      \ trend magnitude (e.g., regression coefficients)\")\n    )\n    is_significant_trend:\
      \ List[bool] = (\n        Field(..., description=\"Indicator of whether trends\
      \ are statistically significant\")\n    )\n    key_patterns: List[str] = (\n\
      \        Field(..., description=\"Summary of primary patterns identified in\
      \ macroeconomic indicators\")\n    )\n\n\ndef conduct_trend_analysis(collect_economic_data_input:\
      \ CollectEconomicDataOutput, **kwargs) -> ConductTrendAnalysisOutput:\n    \"\
      \"\"\n    Applies statistical analysis to identify directional trends, seasonality,\n\
      \    and magnitude of change in macroeconomic time series data.\n\n    Parameters\n\
      \    ----------\n    economic_data : pd.DataFrame\n        Preprocessed macroeconomic\
      \ time series data with datetime-indexed\n        observations\n    significance_level\
      \ : float\n        Threshold for determining statistical significance (p-value\
      \ cutoff),\n        default 0.05\n\n    Returns\n    -------\n    Dict[str,\
