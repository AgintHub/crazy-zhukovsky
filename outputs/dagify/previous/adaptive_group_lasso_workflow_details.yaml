dag_type: plain_text
description: A highly concurrent workflow for implementing adaptive group lasso, including
  data preparation, group definition, adaptive weight estimation, hyperparameter tuning,
  and model evaluation.
name: adaptive_group_lasso_workflow
nodes:
  calculate_adaptive_weights:
    agent: false
    description: Compute adaptive weights from initial coefficient estimates
    name: calculate_adaptive_weights
    nodes_depended_on:
    - estimate_initial_coefficients
    nodes_dependent_on:
    - perform_cross_validation
    - train_adaptive_group_lasso
    prompt: Assign adaptive weights to each group using w_j = 1/|β_j| where β_j is
      the unpenalized estimate from the OLS model. Replace zero-values with minimal
      positive ε=0.001 normalization.
  define_variable_groups:
    agent: false
    description: Define logical groupings of variables for the lasso algorithm
    name: define_variable_groups
    nodes_depended_on: []
    nodes_dependent_on:
    - calculate_adaptive_weights
    - perform_cross_validation
    - train_adaptive_group_lasso
    prompt: Partition features into mutually exclusive, pre-defined groups. For each
      variable, assign a group ID. Return as a dictionary of group IDs → variable
      indices.
  estimate_initial_coefficients:
    agent: false
    description: Estimate baseline coefficients for weight calculation
    name: estimate_initial_coefficients
    nodes_depended_on:
    - load_prepare_data
    nodes_dependent_on:
    - calculate_adaptive_weights
    prompt: Fit an ordinary least squares regression model to the preprocessed data
      and return the estimated coefficient vector.
  evaluate_model_performance:
    agent: false
    description: Quantify the predictive accuracy of the final model
    name: evaluate_model_performance
    nodes_depended_on:
    - train_adaptive_group_lasso
    nodes_dependent_on: []
    prompt: 'Compute evaluation metrics on test data: mean squared error, R² score,
      and variable selection consistency. Compare against baseline OLS performance.'
  load_prepare_data:
    agent: false
    description: Load and preprocess the dataset for the adaptive group lasso implementation
    name: load_prepare_data
    nodes_depended_on: []
    nodes_dependent_on:
    - estimate_initial_coefficients
    - define_variable_groups
    prompt: Standardize the dataset (zero mean, unit variance) and handle missing
      values. Return the preprocessed matrix (X) and response vector (y).
  perform_cross_validation:
    agent: false
    description: Determine optimal regularization strength via cross-validation
    name: perform_cross_validation
    nodes_depended_on:
    - load_prepare_data
    - define_variable_groups
    - calculate_adaptive_weights
    nodes_dependent_on:
    - train_adaptive_group_lasso
    prompt: Perform k-fold cross-validation for the adaptive group lasso. Evaluate
      performance across a grid of λ values (0.01, 0.1, 1.0). Return the λ that minimizes
      average validation MSE.
  train_adaptive_group_lasso:
    agent: false
    description: Train the adaptive group lasso model with computed parameters
    name: train_adaptive_group_lasso
    nodes_depended_on:
    - load_prepare_data
    - define_variable_groups
    - calculate_adaptive_weights
    - perform_cross_validation
    nodes_dependent_on:
    - evaluate_model_performance
    prompt: Fit adaptive group lasso model using the preprocessed data, defined groups,
      calculated weights, and selected λ. Return group-wise selected variables and
      coefficients.
