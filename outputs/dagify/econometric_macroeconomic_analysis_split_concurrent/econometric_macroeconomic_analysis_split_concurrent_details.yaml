dag_type: stub
description: Split each node in the original workflow into two concurrent subtasks
  and restructure the dependencies accordingly while preserving data flow and type
  safety.
name: econometric_macroeconomic_analysis_split_concurrent
nodes:
  apply_econometric_models_part1:
    agent: false
    code_node_type: stub
    description: Implement econometric models (e.g., VAR, UCM) using significant drivers
      and trend inputs.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass ConductTrendAnalysisPart1Output(BaseModel):\n    \"\"\"Pydantic model\
      \ for conduct_trend_analysis_part1 node outputs.\"\"\"\n    trend_directions:\
      \ List[str] = (\n        Field(..., description=\"Textual description of identified\
      \ trend directions (e.g., 'upward', 'downward', 'stable')\")\n    )\n    seasonality_patterns:\
      \ List[str] = (\n        Field(..., description=\"Identified seasonal patterns\
      \ in time series data\")\n    )\n    trend_magnitudes: List[float] = (\n   \
      \     Field(..., description=\"Numerical values representing trend magnitude\
      \ (e.g., regression coefficients)\")\n    )\n\n\nclass ConductTrendAnalysisPart2Output(BaseModel):\n\
      \    \"\"\"Pydantic model for conduct_trend_analysis_part2 node outputs.\"\"\
      \"\n    is_significant_trend: List[bool] = (\n        Field(..., description=\"\
      Indicator of whether trends are statistically significant\")\n    )\n    key_patterns:\
      \ List[str] = (\n        Field(..., description=\"Summary of primary patterns\
      \ identified in macroeconomic indicators\")\n    )\n\n\nclass IdentifyKeyMacroeconomicDriversPart1Output(BaseModel):\n\
      \    \"\"\"Pydantic model for identify_key_macroeconomic_drivers_part1 node\
      \ outputs.\"\"\"\n    key_variables: List[str] = (\n        Field(..., description=\"\
      List of identified key macroeconomic variables.\")\n    )\n    importance_scores:\
      \ List[float] = (\n        Field(..., description=\"Relative importance score\
      \ for each key variable (higher indicates greater influence).\")\n    )\n\n\n\
      class IdentifyKeyMacroeconomicDriversPart2Output(BaseModel):\n    \"\"\"Pydantic\
      \ model for identify_key_macroeconomic_drivers_part2 node outputs.\"\"\"\n \
      \   relationship_strength: List[float] = (\n        Field(..., description=\"\
      Numeric strength of the relationship between each key variable and the target\
      \ macroeconomic indicator.\")\n    )\n    relationship_direction: List[str]\
      \ = (\n        Field(..., description=\"Direction of the relationship for each\
      \ key variable (e.g., 'positive', 'negative').\")\n    )\n\n\nclass ApplyEconometricModelsPart1Output(BaseModel):\n\
      \    \"\"\"Pydantic model for apply_econometric_models_part1 node outputs.\"\
      \"\"\n    model_name: str = (\n        Field(..., description=\"Name of the\
      \ econometric model used (e.g., 'Vector Autoregression', 'Unobserved Components\
      \ Model')\")\n    )\n    forecast_values: List[float] = (\n        Field(...,\
      \ description=\"Numerical forecasts of macroeconomic performance metrics\")\n\
      \    )\n    significant_drivers: List[str] = (\n        Field(..., description=\"\
      List of statistically significant macroeconomic drivers included in the model\"\
      )\n    )\n\n\ndef apply_econometric_models_part1(conduct_trend_analysis_part1_input:\
      \ ConductTrendAnalysisPart1Output, conduct_trend_analysis_part2_input: ConductTrendAnalysisPart2Output,\
      \ identify_key_macroeconomic_drivers_part1_input: IdentifyKeyMacroeconomicDriversPart1Output,\
      \ identify_key_macroeconomic_drivers_part2_input: IdentifyKeyMacroeconomicDriversPart2Output,\
      \ **kwargs) -> ApplyEconometricModelsPart1Output:\n    \"\"\"\n    Fit an econometric\
      \ model to trend and driver data and produce forecasts.\n\n    Parameters\n\
      \    ----------\n    trend_data : dict\n        Dictionary containing outputs\
      \ from the trend analysis nodes: -\n        \"trend_directions\": List[str]\
      \ – direction of each detected trend. -\n        \"seasonality_patterns\": List[str]\
      \ – seasonal pattern identifiers. -\n        \"trend_magnitudes\": List[float]\
      \ – numeric magnitude (e.g., slope) of\n        each trend. - \"is_significant_trend\"\
      : List[bool] – significance flag\n        for each trend. - \"key_patterns\"\
      : List[str] – textual summary of the\n        most important patterns.\n   \
      \ driver_data : dict\n        Dictionary containing outputs from the driver‑identification\
      \ nodes:\n        - \"key_variables\": List[str] – selected macroeconomic drivers.\
      \ -\n        \"importance_scores\": List[float] – relative importance of each\n\
      \        driver. - \"relationship_strength\": List[float] – strength of each\n\
      \        driver’s relationship to the target. - \"relationship_direction\":\n\
      \        List[str] – \"positive\" or \"negative\" direction for each driver.\n\
      \    model_type : str\n        Choice of econometric model to fit. Supported\
      \ values: \"VAR\" (Vector\n        Autoregression) or \"UCM\" (Unobserved Components\
      \ Model).\n\n    Returns\n    -------\n    dict\n        Dictionary with keys:\
      \ - \"model_name\": str – the concrete model\n        instantiated (e.g., \"\
      Vector Autoregression\"). - \"forecast_values\":\n        List[float] – forecasted\
      \ values for the target metric over the\n        specified horizon. - \"significant_drivers\"\
      : List[str] – subset of\n        driver_data[\"key_variables\"] that were retained\
      \ as statistically\n        significant in the fitted model.\n\n    Raises\n\
      \    ------\n    ValueError\n        If any required field in trend_data or\
      \ driver_data is missing,\n        empty, or has mismatched lengths.\n    RuntimeError\n\
      \        If the chosen model fails to converge or encounters singular matrix\n\
      \        issues during estimation.\n\n    Examples\n    --------\n    >>> trend_data\
      \ = {\n    ...     \"trend_directions\": [\"upward\", \"stable\"],\n    ...\
      \     \"seasonality_patterns\": [\"quarterly\"],\n    ...     \"trend_magnitudes\"\
      : [0.02, 0.0],\n    ...     \"is_significant_trend\": [True, False],\n    ...\
      \     \"key_patterns\": [\"Q1 growth\"]\n    >>> }\n    >>> driver_data = {\n\
      \    ...     \"key_variables\": [\"interest_rate\", \"unemployment\"],\n   \
      \ ...     \"importance_scores\": [0.8, 0.6],\n    ...     \"relationship_strength\"\
      : [0.45, -0.30],\n    ...     \"relationship_direction\": [\"negative\", \"\
      negative\"]\n    >>> }\n    >>> result = apply_econometric_models(trend_data,\
      \ driver_data,\n    model_type=\"VAR\")\n    >>> print(result)\n    {'model_name':\
      \ 'Vector Autoregression', 'forecast_values': [2.5, 2.7, 2.9],\n    'significant_drivers':\
      \ ['interest_rate']}\n\n    \"\"\"\n    return ApplyEconometricModelsPart1Output(\n\
      \        model_name=\"\",\n        forecast_values=[],\n        significant_drivers=[],\n\
      \    )"
    name: apply_econometric_models_part1
    nodes_depended_on:
    - conduct_trend_analysis_part1
    - conduct_trend_analysis_part2
    - identify_key_macroeconomic_drivers_part1
    - identify_key_macroeconomic_drivers_part2
    nodes_dependent_on: []
    output_structure:
    - description: Name of the econometric model used (e.g., 'Vector Autoregression',
        'Unobserved Components Model')
      key: model_name
      type: str
    - description: Numerical forecasts of macroeconomic performance metrics
      key: forecast_values
      type: List[float]
    - description: List of statistically significant macroeconomic drivers included
        in the model
      key: significant_drivers
      type: List[str]
    prd:
      conceptual_info: This node fits an econometric forecasting model (such as VAR
        or UCM) to the macroeconomic time‑series trends and the set of statistically
        significant drivers identified earlier. The fitted model is then used to generate
        forward‑looking forecasts for the target macroeconomic performance metrics.
      docstring:
        examples:
        - lines:
          - trend_data = {
          - '    "trend_directions": ["upward", "stable"],'
          - '    "seasonality_patterns": ["quarterly"],'
          - '    "trend_magnitudes": [0.02, 0.0],'
          - '    "is_significant_trend": [True, False],'
          - '    "key_patterns": ["Q1 growth"]'
          - '}'
          - driver_data = {
          - '    "key_variables": ["interest_rate", "unemployment"],'
          - '    "importance_scores": [0.8, 0.6],'
          - '    "relationship_strength": [0.45, -0.30],'
          - '    "relationship_direction": ["negative", "negative"]'
          - '}'
          - result = apply_econometric_models(trend_data, driver_data, model_type="VAR")
          - print(result)
          output: '{''model_name'': ''Vector Autoregression'', ''forecast_values'':
            [2.5, 2.7, 2.9], ''significant_drivers'': [''interest_rate'']}'
        parameters:
        - description: 'Dictionary containing outputs from the trend analysis nodes:

            - "trend_directions": List[str] – direction of each detected trend.

            - "seasonality_patterns": List[str] – seasonal pattern identifiers.

            - "trend_magnitudes": List[float] – numeric magnitude (e.g., slope) of
            each trend.

            - "is_significant_trend": List[bool] – significance flag for each trend.

            - "key_patterns": List[str] – textual summary of the most important patterns.'
          name: trend_data
          type: dict
        - description: 'Dictionary containing outputs from the driver‑identification
            nodes:

            - "key_variables": List[str] – selected macroeconomic drivers.

            - "importance_scores": List[float] – relative importance of each driver.

            - "relationship_strength": List[float] – strength of each driver’s relationship
            to the target.

            - "relationship_direction": List[str] – "positive" or "negative" direction
            for each driver.'
          name: driver_data
          type: dict
        - description: 'Choice of econometric model to fit. Supported values: "VAR"
            (Vector Autoregression) or "UCM" (Unobserved Components Model).'
          name: model_type
          type: str
        raises:
        - description: If any required field in trend_data or driver_data is missing,
            empty, or has mismatched lengths.
          type: ValueError
        - description: If the chosen model fails to converge or encounters singular
            matrix issues during estimation.
          type: RuntimeError
        returns:
          description: 'Dictionary with keys:

            - "model_name": str – the concrete model instantiated (e.g., "Vector Autoregression").

            - "forecast_values": List[float] – forecasted values for the target metric
            over the specified horizon.

            - "significant_drivers": List[str] – subset of driver_data["key_variables"]
            that were retained as statistically significant in the fitted model.'
          type: dict
        summary: Fit an econometric model to trend and driver data and produce forecasts.
    prompt: Apply established econometric models such as Vector Autoregression or
      Unobserved Components Model to forecast macroeconomic performance using identified
      drivers and trends.
    shims: []
  apply_econometric_models_part2:
    agent: false
    code_node_type: stub
    description: Evaluate model validity and compute diagnostic metrics.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass ConductTrendAnalysisPart1Output(BaseModel):\n    \"\"\"Pydantic model\
      \ for conduct_trend_analysis_part1 node outputs.\"\"\"\n    trend_directions:\
      \ List[str] = (\n        Field(..., description=\"Textual description of identified\
      \ trend directions (e.g., 'upward', 'downward', 'stable')\")\n    )\n    seasonality_patterns:\
      \ List[str] = (\n        Field(..., description=\"Identified seasonal patterns\
      \ in time series data\")\n    )\n    trend_magnitudes: List[float] = (\n   \
      \     Field(..., description=\"Numerical values representing trend magnitude\
      \ (e.g., regression coefficients)\")\n    )\n\n\nclass ConductTrendAnalysisPart2Output(BaseModel):\n\
      \    \"\"\"Pydantic model for conduct_trend_analysis_part2 node outputs.\"\"\
      \"\n    is_significant_trend: List[bool] = (\n        Field(..., description=\"\
      Indicator of whether trends are statistically significant\")\n    )\n    key_patterns:\
      \ List[str] = (\n        Field(..., description=\"Summary of primary patterns\
      \ identified in macroeconomic indicators\")\n    )\n\n\nclass IdentifyKeyMacroeconomicDriversPart1Output(BaseModel):\n\
      \    \"\"\"Pydantic model for identify_key_macroeconomic_drivers_part1 node\
      \ outputs.\"\"\"\n    key_variables: List[str] = (\n        Field(..., description=\"\
      List of identified key macroeconomic variables.\")\n    )\n    importance_scores:\
      \ List[float] = (\n        Field(..., description=\"Relative importance score\
      \ for each key variable (higher indicates greater influence).\")\n    )\n\n\n\
      class IdentifyKeyMacroeconomicDriversPart2Output(BaseModel):\n    \"\"\"Pydantic\
      \ model for identify_key_macroeconomic_drivers_part2 node outputs.\"\"\"\n \
      \   relationship_strength: List[float] = (\n        Field(..., description=\"\
      Numeric strength of the relationship between each key variable and the target\
      \ macroeconomic indicator.\")\n    )\n    relationship_direction: List[str]\
      \ = (\n        Field(..., description=\"Direction of the relationship for each\
      \ key variable (e.g., 'positive', 'negative').\")\n    )\n\n\nclass ApplyEconometricModelsPart2Output(BaseModel):\n\
      \    \"\"\"Pydantic model for apply_econometric_models_part2 node outputs.\"\
      \"\"\n    evaluation_metrics: List[float] = (\n        Field(..., description=\"\
      Quantitative metrics for model performance evaluation (e.g., MAE, RMSE, R-squared)\"\
      )\n    )\n    is_model_valid: bool = (\n        Field(..., description=\"Indicates\
      \ whether the model passed diagnostic checks (e.g., multicollinearity tests)\"\
      )\n    )\n\n\ndef apply_econometric_models_part2(conduct_trend_analysis_part1_input:\
      \ ConductTrendAnalysisPart1Output, conduct_trend_analysis_part2_input: ConductTrendAnalysisPart2Output,\
      \ identify_key_macroeconomic_drivers_part1_input: IdentifyKeyMacroeconomicDriversPart1Output,\
      \ identify_key_macroeconomic_drivers_part2_input: IdentifyKeyMacroeconomicDriversPart2Output,\
      \ **kwargs) -> ApplyEconometricModelsPart2Output:\n    \"\"\"\n    Validate\
      \ an econometric model and compute diagnostic performance metrics.\n\n    Parameters\n\
      \    ----------\n    trend_directions : List[str]\n        Directional trend\
      \ labels (e.g., 'upward', 'downward') from\n        conduct_trend_analysis_part1.\n\
      \    seasonality_patterns : List[str]\n        Identified seasonal patterns\
      \ from conduct_trend_analysis_part1.\n    trend_magnitudes : List[float]\n \
      \       Numerical magnitudes of each trend (e.g., regression coefficients).\n\
      \    is_significant_trend : List[bool]\n        Statistical significance flags\
      \ for each trend from\n        conduct_trend_analysis_part2.\n    key_variables\
      \ : List[str]\n        Key macroeconomic drivers identified in\n        identify_key_macroeconomic_drivers_part1.\n\
      \    importance_scores : List[float]\n        Relative importance scores for\
      \ each key variable.\n    relationship_strength : List[float]\n        Strength\
      \ of the relationship between each key variable and the\n        target indicator.\n\
      \    relationship_direction : List[str]\n        Direction ('positive'/'negative')\
      \ of each relationship.\n    model_name : str\n        Identifier of the econometric\
      \ model used (e.g., 'Vector\n        Autoregression').\n    forecast_values\
      \ : List[float]\n        Forecasted macro‑economic values produced by the model.\n\
      \    significant_drivers : List[str]\n        Drivers that passed statistical\
      \ significance thresholds in part 1.\n\n    Returns\n    -------\n    dict\n\
      \        Dictionary containing 'evaluation_metrics' (list of floats) and\n \
      \       'is_model_valid' (bool).\n\n    Raises\n    ------\n    ValueError\n\
      \        If required input lists are mismatched in length or missing.\n    RuntimeError\n\
      \        If any diagnostic calculation fails (e.g., singular matrix during\n\
      \        VIF computation).\n\n    Examples\n    --------\n    >>> result = apply_econometric_models_part2(\n\
      \    ...     trend_directions=['upward'],\n    ...     seasonality_patterns=['annual'],\n\
      \    ...     trend_magnitudes=[0.03],\n    ...     is_significant_trend=[True],\n\
      \    ...     key_variables=['inflation'],\n    ...     importance_scores=[0.85],\n\
      \    ...     relationship_strength=[0.78],\n    ...     relationship_direction=['positive'],\n\
      \    ...     model_name='Vector Autoregression',\n    ...     forecast_values=[2.5,\
      \ 2.7, 2.9],\n    ...     significant_drivers=['inflation']\n    >>> )\n   \
      \ {'evaluation_metrics': [0.12, 0.45, 0.92], 'is_model_valid': True}\n\n   \
      \ >>> apply_econometric_models_part2(\n    ...     trend_directions=[],\n  \
      \  ...     seasonality_patterns=[],\n    ...     trend_magnitudes=[],\n    ...\
      \     is_significant_trend=[],\n    ...     key_variables=[],\n    ...     importance_scores=[],\n\
      \    ...     relationship_strength=[],\n    ...     relationship_direction=[],\n\
      \    ...     model_name='VAR',\n    ...     forecast_values=[],\n    ...   \
      \  significant_drivers=[]\n    >>> )\n    ValueError: Input lists cannot be\
      \ empty.\n\n    \"\"\"\n    return ApplyEconometricModelsPart2Output(\n    \
      \    evaluation_metrics=[],\n        is_model_valid=False,\n    )"
    name: apply_econometric_models_part2
    nodes_depended_on:
    - conduct_trend_analysis_part1
    - conduct_trend_analysis_part2
    - identify_key_macroeconomic_drivers_part1
    - identify_key_macroeconomic_drivers_part2
    nodes_dependent_on: []
    output_structure:
    - description: Quantitative metrics for model performance evaluation (e.g., MAE,
        RMSE, R-squared)
      key: evaluation_metrics
      type: List[float]
    - description: Indicates whether the model passed diagnostic checks (e.g., multicollinearity
        tests)
      key: is_model_valid
      type: bool
    prd:
      conceptual_info: This node validates the econometric model generated in part 1
        by running a suite of diagnostic tests (multicollinearity, omitted‑variable
        bias, convergence) and by computing standard forecasting performance metrics.
        The results determine whether the model is statistically sound and ready for
        downstream evaluation and recommendation generation.
      docstring:
        examples:
        - lines:
          - result = apply_econometric_models_part2(
          - '    trend_directions=[''upward''],'
          - '    seasonality_patterns=[''annual''],'
          - '    trend_magnitudes=[0.03],'
          - '    is_significant_trend=[True],'
          - '    key_variables=[''inflation''],'
          - '    importance_scores=[0.85],'
          - '    relationship_strength=[0.78],'
          - '    relationship_direction=[''positive''],'
          - '    model_name=''Vector Autoregression'','
          - '    forecast_values=[2.5, 2.7, 2.9],'
          - '    significant_drivers=[''inflation'']'
          - )
          output: '{''evaluation_metrics'': [0.12, 0.45, 0.92], ''is_model_valid'':
            True}'
        - lines:
          - apply_econometric_models_part2(
          - '    trend_directions=[],'
          - '    seasonality_patterns=[],'
          - '    trend_magnitudes=[],'
          - '    is_significant_trend=[],'
          - '    key_variables=[],'
          - '    importance_scores=[],'
          - '    relationship_strength=[],'
          - '    relationship_direction=[],'
          - '    model_name=''VAR'','
          - '    forecast_values=[],'
          - '    significant_drivers=[]'
          - )
          output: 'ValueError: Input lists cannot be empty.'
        parameters:
        - description: Directional trend labels (e.g., 'upward', 'downward') from
            conduct_trend_analysis_part1.
          name: trend_directions
          type: List[str]
        - description: Identified seasonal patterns from conduct_trend_analysis_part1.
          name: seasonality_patterns
          type: List[str]
        - description: Numerical magnitudes of each trend (e.g., regression coefficients).
          name: trend_magnitudes
          type: List[float]
        - description: Statistical significance flags for each trend from conduct_trend_analysis_part2.
          name: is_significant_trend
          type: List[bool]
        - description: Key macroeconomic drivers identified in identify_key_macroeconomic_drivers_part1.
          name: key_variables
          type: List[str]
        - description: Relative importance scores for each key variable.
          name: importance_scores
          type: List[float]
        - description: Strength of the relationship between each key variable and
            the target indicator.
          name: relationship_strength
          type: List[float]
        - description: Direction ('positive'/'negative') of each relationship.
          name: relationship_direction
          type: List[str]
        - description: Identifier of the econometric model used (e.g., 'Vector Autoregression').
          name: model_name
          type: str
        - description: Forecasted macro‑economic values produced by the model.
          name: forecast_values
          type: List[float]
        - description: Drivers that passed statistical significance thresholds in
            part 1.
          name: significant_drivers
          type: List[str]
        raises:
        - description: If required input lists are mismatched in length or missing.
          type: ValueError
        - description: If any diagnostic calculation fails (e.g., singular matrix
            during VIF computation).
          type: RuntimeError
        returns:
          description: Dictionary containing 'evaluation_metrics' (list of floats)
            and 'is_model_valid' (bool).
          type: dict
        summary: Validate an econometric model and compute diagnostic performance
          metrics.
    prompt: Assess model performance and diagnostic checks such as multicollinearity,
      omitted variable bias, and convergence issues. Output evaluation metrics and
      validity flag.
    shims: []
  collect_economic_data_part1:
    agent: false
    code_node_type: stub
    description: Gather macroeconomic data from reliable sources based on defined
      objectives.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass DefineMacroeconomicObjectivesPart1Output(BaseModel):\n    \"\"\"Pydantic\
      \ model for define_macroeconomic_objectives_part1 node outputs.\"\"\"\n    objectives:\
      \ List[str] = (\n        Field(..., description=\"List of primary macroeconomic\
      \ objectives (e.g., GDP growth, inflation control, employment level).\")\n \
      \   )\n\n\nclass DefineMacroeconomicObjectivesPart2Output(BaseModel):\n    \"\
      \"\"Pydantic model for define_macroeconomic_objectives_part2 node outputs.\"\
      \"\"\n    metrics: List[str] = (\n        Field(..., description=\"List of key\
      \ performance metrics associated with each objective (e.g., GDP growth rate,\
      \ CPI inflation rate, unemployment rate).\")\n    )\n\n\nclass CollectEconomicDataPart1Output(BaseModel):\n\
      \    \"\"\"Pydantic model for collect_economic_data_part1 node outputs.\"\"\"\
      \n    data_source_names: List[str] = (\n        Field(..., description=\"Names\
      \ of data sources used (e.g., 'Bureau of Labor Statistics', 'World Bank').\"\
      )\n    )\n\n\ndef collect_economic_data_part1(define_macroeconomic_objectives_part1_input:\
      \ DefineMacroeconomicObjectivesPart1Output, define_macroeconomic_objectives_part2_input:\
      \ DefineMacroeconomicObjectivesPart2Output, **kwargs) -> CollectEconomicDataPart1Output:\n\
      \    \"\"\"\n    Retrieve a list of reputable data source names that can provide\
      \ the\n    requested macroeconomic series.\n\n    Parameters\n    ----------\n\
      \    objectives : List[str]\n        Primary macroeconomic objectives extracted\
      \ from the input\n        description (e.g., ['GDP growth', 'inflation control']).\n\
      \    metrics : List[str]\n        Key performance metrics associated with each\
      \ objective (e.g., ['GDP\n        growth rate', 'CPI inflation rate']).\n\n\
      \    Returns\n    -------\n    List[str]\n        A list of data source names\
      \ that are capable of supplying the\n        required series (e.g., ['World\
      \ Bank', 'Bureau of Labor\n        Statistics']).\n\n    Raises\n    ------\n\
      \    ValueError\n        If either *objectives* or *metrics* is empty or not\
      \ a list of\n        strings.\n    RuntimeError\n        If no suitable data\
      \ source can be identified for the supplied\n        objectives/metrics.\n\n\
      \    Examples\n    --------\n    >>> collect_economic_data(['GDP growth'], ['GDP\
      \ growth rate'])\n    ['World Bank', 'Bureau of Labor Statistics']\n\n    >>>\
      \ collect_economic_data(['Unemployment'], ['Unemployment rate'])\n    ['International\
      \ Labour Organization', 'U.S. Bureau of Labor Statistics']\n\n    \"\"\"\n \
      \   return CollectEconomicDataPart1Output(\n        data_source_names=[],\n\
      \    )"
    name: collect_economic_data_part1
    nodes_depended_on:
    - define_macroeconomic_objectives_part1
    - define_macroeconomic_objectives_part2
    nodes_dependent_on: []
    output_structure:
    - description: Names of data sources used (e.g., 'Bureau of Labor Statistics',
        'World Bank').
      key: data_source_names
      type: List[str]
    prd:
      conceptual_info: This node selects and records the authoritative data providers
        that can supply the macro‑economic series required to measure the previously
        defined objectives and metrics.
      docstring:
        examples:
        - lines:
          - collect_economic_data(['GDP growth'], ['GDP growth rate'])
          output: '[''World Bank'', ''Bureau of Labor Statistics'']'
        - lines:
          - collect_economic_data(['Unemployment'], ['Unemployment rate'])
          output: '[''International Labour Organization'', ''U.S. Bureau of Labor
            Statistics'']'
        parameters:
        - description: Primary macroeconomic objectives extracted from the input description
            (e.g., ['GDP growth', 'inflation control']).
          name: objectives
          type: List[str]
        - description: Key performance metrics associated with each objective (e.g.,
            ['GDP growth rate', 'CPI inflation rate']).
          name: metrics
          type: List[str]
        raises:
        - description: If either *objectives* or *metrics* is empty or not a list
            of strings.
          type: ValueError
        - description: If no suitable data source can be identified for the supplied
            objectives/metrics.
          type: RuntimeError
